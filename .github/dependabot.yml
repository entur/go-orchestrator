version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 100 # Effectively unlimited
- package-ecosystem: "gomod"
  directory: "/"
  exclude-paths:
    - "examples/**"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 100 # Effectively unlimited
  cooldown:
      default-days: 5