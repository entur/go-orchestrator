name: PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
# verify-pr.yml only reads the PR title to validate it.
permissions:
  contents: read
  pull-requests: read
concurrency:
  # event.action in the group: a Dependabot rebase sends synchronize and edited at once,
  # and cancelling one leaves a required check "expected" for ever.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true
jobs:
  verify-pr:
    name: PR
    if: ${{ github.event_name == 'pull_request' }}
    uses: entur/gha-meta/.github/workflows/verify-pr.yml@v1
